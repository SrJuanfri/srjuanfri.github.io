<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(249,115,22,0.18)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Radar Circles -->
  <circle cx="360" cy="107" r="85" fill="none" stroke="rgba(249,115,22,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="360" cy="107" r="55" fill="none" stroke="rgba(249,115,22,0.22)" stroke-width="1"/>
  <circle cx="360" cy="107" r="25" fill="none" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <line x1="360" y1="15" x2="360" y2="200" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <line x1="265" y1="107" x2="455" y2="107" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <circle cx="380" cy="85" r="3" fill="#f97316"/>
  <circle cx="335" cy="130" r="2.5" fill="#38bdf8"/>
  <circle cx="395" cy="125" r="2" fill="#ef4444"/>

  <!-- Corner Brackets -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M 445 35 L 445 15 L 425 15" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M 15 180 L 15 200 L 35 200" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M 445 180 L 445 200 L 425 200" fill="none" stroke="#f97316" stroke-width="2"/>

  <!-- Classification Badge -->
  <g transform="translate(30, 32)">
    <rect width="170" height="22" rx="4" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#ef4444"/>
    <text x="24" y="15" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#fca5a5" letter-spacing="1.5">CLASSIFIED // NDA</text>
  </g>

  <!-- Title -->
  <text x="30" y="85" font-family="'Cabinet Grotesk', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">DEFENSE SIMULATION</text>
  <text x="30" y="105" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="600" fill="#f97316" letter-spacing="1">TACTICAL A.I. &amp; SCENARIO LOGIC</text>

  <!-- Technical specs metadata -->
  <g transform="translate(30, 130)" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9.5" fill="#94a3b8">
    <text x="0" y="0">• REAL-TIME 3D SIMULATION</text>
    <text x="0" y="16">• INSTITUTIONAL &amp; DEFENSE PIPELINE</text>
    <text x="0" y="32">• UNREAL ENGINE 5 ARCHITECTURE</text>
    <text x="0" y="48">• DEEP LEARNING MODEL PROTOCOLS</text>
  </g>
</svg>
